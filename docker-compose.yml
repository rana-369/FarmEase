version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./FeBackend
      dockerfile: FarmEase/Dockerfile
    container_name: farmease-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FarmEaseDB;User Id=sa;Password=YourStrong@Pass123;TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - Redis__ConnectionString=redis:6379
      - JWT__Secret=${JWT_SECRET}
      - JWT__ValidAudience=${JWT_AUDIENCE}
      - JWT__ValidIssuer=${JWT_ISSUER}
      - Razorpay__Key=${RAZORPAY_KEY}
      - Razorpay__Secret=${RAZORPAY_SECRET}
      - SmtpSettings__Email=${SMTP_EMAIL}
      - SmtpSettings__Password=${SMTP_PASSWORD}
      - Sentry__Dsn=${SENTRY_DSN}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPINSIGHTS_CONN_STRING}
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - farmease-network
    volumes:
      - uploads:/app/wwwroot/uploads
      - logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend (React)
  frontend:
    build:
      context: ./FeFrontend
      dockerfile: Dockerfile
    container_name: farmease-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_URL=${API_URL:-http://localhost:5000}
    depends_on:
      - backend
    networks:
      - farmease-network
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro

  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: farmease-db
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Pass123
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    networks:
      - farmease-network
    volumes:
      - sqldata:/var/opt/mssql/data
      - sqldata_backup:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Pass123 -C -Q 'SELECT 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: farmease-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - farmease-network
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Seq for centralized logging (optional)
  seq:
    image: datalust/seq:latest
    container_name: farmease-seq
    restart: unless-stopped
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
    networks:
      - farmease-network
    volumes:
      - seqdata:/data

networks:
  farmease-network:
    driver: bridge

volumes:
  uploads:
  logs:
  sqldata:
  sqldata_backup:
  redisdata:
  seqdata:
